<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables</title>
</head>

<body>
    <h1>JavaScript Variables Assignment 2.4</h1>
    <p>Javascript output can be viewed in the browser console.</p>

    <script>
        // GLOBAL VARIABLE
        let studentName = "Jennifer Salinas";
        
        // Display the variable's value in the console
        console.log("Student Name: ", studentName);
        
        // BLOCK VARIABLE
        {
            let classAssignment = "JavaScript Variables Assignment 2.4";
            
            // Display the block variable's value in the console
            console.log("Block Variable: ", classAssignment);
        }
        
        // MATHEMATICAL OPERATIONS
        let num1 = 10;
        let num2 = 5;
        let sum = num1 + num2;
        let difference = num1 - num2;
        let product = num1 * num2;
        let division = num1 / num2;

        // Display the results in the console
        console.log("Sum: ", sum);
        console.log("Difference: ", difference);
        console.log("Product: ", product);
        console.log("Division: ", division);

        //STRING VARIABLE
        let favoriteSubject = "Web Development";

        // Display the string variable's value in the console
        console.log("Favorite Subject: ", favoriteSubject);

        // OBJECT VARIABLE USING CONST
        const studentDetails = {
            name: "Jennifer Salinas",
            school: "Northwest Vista College",
            major: "Digital Media",
        };

        // Display the object variable's value in the console
        console.log("Student Details: ", studentDetails);

    </script>
    
</body>
</html>
